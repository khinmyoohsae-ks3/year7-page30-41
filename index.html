      padding: 0;

    body {
      background-color: var(--bg);

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      background: var(--card);
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      padding: 32px;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .score-badge {
      background: #f5f3ff;
      color: var(--primary);
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .topic-tag {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      color: #334155;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 15px 18px;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f8fafc;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-letter {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #f1f5f9;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .option-btn.correct .option-letter {
      background: var(--correct-border);
      color: #ffffff;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .option-btn.wrong .option-letter {
      background: var(--wrong-border);
      color: #ffffff;
    }

    .feedback-box {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.45;
      display: none;
    }

    .feedback-box.correct {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .feedback-box.wrong {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .results-container {
      text-align: center;
      display: none;
    }

    .results-container h2 {
      font-size: 1.75rem;

    }

    .final-score {

    .review-list {

      border-top: 1px solid var(--border);
      padding-top: 16px;

      padding: 12px;

    }

    .review-item strong {

    .tag-pass {
      color: #16a34a;
      font-weight: 700;
    }

    .tag-fail {

      font-weight: 700;

  </style>
</head>

  let currentIndex = 0;
  let score = 0;
  let userAnswers = [];

  const questionCounterEl = document.getElementById("question-counter");
  const topicTagEl = document.getElementById("topic-tag");
  const questionTextEl = document.getElementById("question-text");
  const optionsListEl = document.getElementById("options-list");
  const feedbackBoxEl = document.getElementById("feedback-box");
  const nextBtnEl = document.getElementById("next-btn");
  const scoreDisplayEl = document.getElementById("score-display");
  const progressBarEl = document.getElementById("progress-bar");
  const quizViewEl = document.getElementById("quiz-view");
  const resultsViewEl = document.getElementById("results-view");

  function loadQuestion() {
    const q = questions[currentIndex];
    questionCounterEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    topicTagEl.textContent = q.topic;
    questionTextEl.textContent = q.question;
    progressBarEl.style.width = `${(currentIndex / questions.length) * 100}%`;

    feedbackBoxEl.className = "feedback-box";
    feedbackBoxEl.textContent = "";
    nextBtnEl.disabled = true;
    nextBtnEl.textContent = currentIndex === questions.length - 1 ? "Finish Quiz" : "Next Question →";

    optionsListEl.innerHTML = "";
    const letters = ["A", "B", "C", "D"];

    q.options.forEach((optionText, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${optionText}</span>`;
      btn.onclick = () => selectOption(idx);
      optionsListEl.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    const q = questions[currentIndex];
    const buttons = optionsListEl.querySelectorAll(".option-btn");
    const isCorrect = selectedIdx === q.answer;

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) {
        btn.classList.add("correct");
      } else if (idx === selectedIdx && !isCorrect) {
        btn.classList.add("wrong");
      }
    });

    if (isCorrect) {
      score++;
      scoreDisplayEl.textContent = `Score: ${score} / ${questions.length}`;
      feedbackBoxEl.className = "feedback-box correct";
      feedbackBoxEl.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
    } else {
      feedbackBoxEl.className = "feedback-box wrong";
      feedbackBoxEl.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
    }

    userAnswers.push({
      question: q.question,
      selected: q.options[selectedIdx],
      correct: q.options[q.answer],
      isCorrect: isCorrect
    });

    nextBtnEl.disabled = false;
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    progressBarEl.style.width = "100%";
    quizViewEl.style.display = "none";
    resultsViewEl.style.display = "block";

    document.getElementById("final-score").textContent = `${score} / ${questions.length}`;

    const percentage = Math.round((score / questions.length) * 100);
    let msg = "";
    if (percentage >= 85) {
      msg = `Outstanding (${percentage}%)! You've mastered Computing: Past, Present and Future.`;
    } else if (percentage >= 60) {
      msg = `Good effort (${percentage}%)! Review the missed questions below to hit 100%.`;
    } else {
      msg = `You scored ${percentage}%. Review pages 30–41 and try again!`;
    }
    document.getElementById("performance-msg").textContent = msg;

    const reviewListEl = document.getElementById("review-list");
    reviewListEl.innerHTML = "<h3 style='margin-bottom:12px;'>Question Review</h3>";

    userAnswers.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "review-item";
      div.innerHTML = `
        <strong>Q${index + 1}: ${item.question}</strong>
        <span class="${item.isCorrect ? "tag-pass" : "tag-fail"}">
          ${item.isCorrect ? "✓ Correct" : "✗ Your answer: " + item.selected}
        </span>
        ${!item.isCorrect ? `<br><span style="color:#334155;">Correct answer: <b>${item.correct}</b></span>` : ""}
      `;
      reviewListEl.appendChild(div);
    });
  }

  function restartQuiz() {
    currentIndex = 0;
    score = 0;
    userAnswers = [];
    scoreDisplayEl.textContent = `Score: 0 / ${questions.length}`;
    resultsViewEl.style.display = "none";
    quizViewEl.style.display = "block";
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>
